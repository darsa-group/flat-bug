# yolo26l-seg on GenomeDK (H200, 141 GB).
#
# Batch chosen from a measured sweep on an H200 at 1024px (31.5M params):
#   batch  8:  29.9 GiB (21%)  31.0 img/s
#   batch 16:  59.7 GiB (43%)  50.4 img/s   <- chosen
#   batch 24:  89.4 GiB (64%)  51.8 img/s
#   batch 32: 119.2 GiB (85%)  52.7 img/s
#   batch 48: OOM
# Memory is linear at 3.73 GiB/image and throughput saturates by 16, so 32 buys
# 4.6% more img/s for double the memory.
#
# The probe used random tensors and a surrogate loss, so it does NOT capture the
# spike that trainers.py documents: YOLOv26's one2many head makes
# single_mask_loss/crop_mask allocate 10+ GB on dense flat-bug images, which is
# why validation loss is suppressed there. Batch 16 leaves 57% of the card for
# that; batch 32 would leave 15%.
#
# nbs stays 64, so the effective batch matches the GHPC runs (batch 8 x 8)
# despite the larger per-step batch.
batch: 16
nbs: 64
model: "yolo26l-seg.pt"     # published asset; ultralytics downloads it on first use
epochs: 100
device: 0
patience: 9999
lr0: 0.01
lrf: 0.00001
optimizer: 'SGD'
workers: 16
fb_max_instances: 9999
fb_max_images: -1
# Synthetic touching-instance scenes are off here: establish the L baseline
# first, then turn them on with the settings that won on the M model.
fb_synth_prob: 0.0
